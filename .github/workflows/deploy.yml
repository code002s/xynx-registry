name: Sync DNS

on:
  push:
    branches: [main]
    paths:
      - 'domains/**'
  workflow_dispatch:

concurrency:
  group: dns-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate
        run: node scripts/validate.js
      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONES: ${{ secrets.CF_ZONES }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ZONES" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(find domains -name '*.json' -print -quit)" ]; then
            echo "::error::CF_API_TOKEN / CF_ZONES are not set, but domains/*.json exist."
            exit 1
          else
            echo "::warning::Cloudflare secrets are not set yet — DNS sync skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync to Cloudflare
        if: steps.cf.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONES: ${{ secrets.CF_ZONES }}
        run: node scripts/sync.js
