name: Sync DNS

on:
  push:
    branches: [main]
    paths:
      - 'domains/**'
  workflow_dispatch:

concurrency:
  group: dns-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate
        run: node scripts/validate.js
      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONES: ${{ secrets.CF_ZONES }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ZONES" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare is not configured (CF_API_TOKEN / CF_ZONES missing) — DNS was not changed."
          {
            echo "### DNS sync skipped"
            echo ""
            echo "Cloudflare is not configured yet, so no DNS records were created or removed."
            echo "Add the \`CF_API_TOKEN\` and \`CF_ZONES\` secrets in **Settings → Secrets and variables → Actions**."
            echo "Until then \`domains/*.json\` are stored in the repo but the subdomains do not resolve."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sync to Cloudflare
        if: steps.cf.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONES: ${{ secrets.CF_ZONES }}
        run: node scripts/sync.js
